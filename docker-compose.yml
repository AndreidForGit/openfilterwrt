services:
  openwrt-controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: openwrt-controller:local
    container_name: openwrt-controller
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    environment:
      LISTEN_ADDRESS: ":8080"
      STATIC_DIRECTORY: "/app/static"
      ROUTER_ADDRESS: "${ROUTER_ADDRESS:?set ROUTER_ADDRESS before running docker compose}"
      ROUTER_USERNAME: "${ROUTER_USERNAME:?set ROUTER_USERNAME before running docker compose}"
      ROUTER_PASSWORD: "${ROUTER_PASSWORD:-}"
      ROUTER_HOST_KEY_FINGERPRINT: "${ROUTER_HOST_KEY_FINGERPRINT:-}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:-}"
      ROUTER_SSH_TIMEOUT_SECONDS: "${ROUTER_SSH_TIMEOUT_SECONDS:-10}"
      DNSMASQ_SERVICE_NAME: "${DNSMASQ_SERVICE_NAME:-dnsmasq}"
      ROUTER_WIRELESS_SECTIONS: "${ROUTER_WIRELESS_SECTIONS:-}"
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # network_mode: host
